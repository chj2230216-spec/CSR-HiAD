name: Import pinned HiAD and test CSR
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-and-test.yml'
permissions:
  contents: write
concurrency:
  group: upstream-import
  cancel-in-progress: false
jobs:
  import-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import original HiAD history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/import_hiad.sh
          git merge-base --is-ancestor 54f7c2e49956cffa231d1ec6e19a373c68a6254f HEAD
          test -f LICENSE
          git push origin HEAD:main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy pytest
      - run: python -m compileall -q hiad/csr_model.py hiad/csr_calibration.py hiad/detectors/hr_csr_patchcore.py runs/run_csr_patchcore.py tests/test_csr_model.py
      - run: python -m pytest -q tests/test_csr_model.py
