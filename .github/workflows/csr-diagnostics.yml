name: CSR diagnostic CPU checks
on:
  push:
    paths:
      - 'hiad/csr_*.py'
      - 'runs/run_csr*.py'
      - 'tests/test_csr*.py'
      - 'scripts/*csr*'
      - 'scripts/run_round1_diagnostics.sh'
      - '.github/workflows/csr-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy pytest
      - run: python -m compileall -q hiad/csr_model.py hiad/csr_diagnostics.py hiad/csr_metrics.py runs/run_csr_diagnostics.py runs/run_csr_patchcore.py scripts/summarize_csr_diagnostics.py
      - run: bash -n scripts/run_round1_diagnostics.sh
      - run: python -m pytest -q tests/test_csr_model.py tests/test_csr_diagnostics.py tests/test_csr_metrics.py
